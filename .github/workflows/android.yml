name: Build Android app
# Builds the test APK (Releases: android-test) and, with signing secrets, the Play AAB.

on:
  push:
    branches: [main]
    paths: ["www/**", "assets/**", "capacitor.config.json", "package.json", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Test web app
        run: node tools/verify.cjs

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Generate Android project and icons
        run: npm run android:add

      - name: Set version (versionCode = run number)
        run: |
          VERSION_NAME=$(node -p "require('./package.json').version")
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]+\"/versionName \"${VERSION_NAME}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Sync web files
        run: npx cap sync android

      - name: Build debug APK (for testing on your phone)
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: digital-check-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Publish test APK to GitHub Releases (android-test)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk digital-check-test.apk
          NOTES="휴대폰 테스트용 APK (빌드 #${{ github.run_number }}, ${GITHUB_SHA::7}). 플레이스토어 배포본이 아닙니다. 설치하려면 '출처를 알 수 없는 앱' 허용이 필요합니다."
          if gh release view android-test >/dev/null 2>&1; then
            gh release upload android-test digital-check-test.apk --clobber
            gh release edit android-test --notes "$NOTES"
          else
            gh release create android-test digital-check-test.apk --prerelease --title "안드로이드 테스트 빌드" --notes "$NOTES" --target "$GITHUB_SHA"
          fi

      - name: Build signed release AAB (for Google Play)
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          ./gradlew --no-daemon bundleRelease
          AAB=app/build/outputs/bundle/release/app-release.aab
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore "$RUNNER_TEMP/upload.jks" -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
            "$AAB" "$KEY_ALIAS"
          jarsigner -verify "$AAB"
          mv "$AAB" "$GITHUB_WORKSPACE/digital-check-${{ github.run_number }}.aab"
          rm -f "$RUNNER_TEMP/upload.jks"
      - name: Upload release AAB
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digital-check-release-aab
          path: digital-check-*.aab
